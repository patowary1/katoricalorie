<!DOCTYPE html>
<html lang="en">
<head>
    <script defer src="https://cloud.umami.is/script.js" data-website-id="bdefdf2c-6bcb-4bcf-8c60-e4da57c7f9c8"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KatoriCalorie - Indian Food & Exercise Tracker</title>
    <link rel="canonical" href="https://katoricalorie.in">
    <style>
        :root {
            --primary: #ff6f00;
            --primary-dark: #e65100;
            --primary-light: rgba(255, 111, 0, 0.1);
            --secondary: #2e7d32;
            --dark: #1e1e24;
            --light: #f5f5f7;
            --card-bg: #2d2d34;
            --text-light: #ffffff;
            --text-gray: #b0b0b5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--dark);
            color: var(--text-light);
            padding-bottom: 60px;
        }

        .header {
            background: linear-gradient(135deg, #2d2d34, #1e1e24);
            padding: 2rem 1rem;
            text-align: center;
            border-bottom: 1px solid #3d3d45;
        }

        .welcome-msg {
            font-size: 0.9rem;
            color: var(--primary);
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        /* Katori Visual Meter */
        .katori-container {
            display: flex;
            justify-content: center;
            margin: 1.5rem 0;
        }

        .katori-bowl {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: 8px solid #5d4037;
            background: #3e2723;
            position: relative;
            box-shadow: inset 0 10px 20px rgba(0,0,0,0.6), 0 10px 15px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .katori-bowl::before, .katori-bowl::after {
            content: '';
            position: absolute;
            width: 25px;
            height: 12px;
            background: #5d4037;
            top: 45%;
            border-radius: 4px;
        }
        .katori-bowl::before { left: -28px; }
        .katori-bowl::after { right: -28px; }

        .katori-fill {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 0%;
            background: linear-gradient(to top, #ff6f00, #ffb300);
            transition: height 0.5s ease;
            opacity: 0.7;
        }

        .meter-content {
            z-index: 2;
            text-align: center;
        }

        .meter-label {
            font-size: 0.75rem;
            color: var(--text-gray);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .meter-value {
            font-size: 1.8rem;
            font-weight: 800;
            color: #ffffff;
            margin: 2px 0;
        }

        .meter-target {
            font-size: 0.75rem;
            color: #ffb300;
        }

        /* Search Section */
        .search-container {
            max-width: 500px;
            margin: 1.5rem auto;
            padding: 0 1rem;
            display: flex;
            gap: 8px;
        }

        .search-box {
            flex: 1;
            padding: 12px 16px;
            border-radius: 30px;
            border: 1px solid #4d4d55;
            background: #2d2d34;
            color: white;
            font-size: 1rem;
            outline: none;
        }

        .search-btn {
            padding: 0 20px;
            border-radius: 30px;
            border: none;
            background: var(--primary);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .search-btn:hover {
            background: var(--primary-dark);
        }

        /* Navigation Tabs */
        .tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 1.5rem;
            padding: 0 1rem;
            overflow-x: auto;
        }

        .tab-btn {
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid #4d4d55;
            background: #2d2d34;
            color: var(--text-gray);
            cursor: pointer;
            font-weight: 600;
            white-space: nowrap;
        }

        .tab-btn.active {
            background: var(--primary-light);
            border-color: var(--primary);
            color: var(--primary);
        }

        .tab-btn.exercise-tab.active {
            background: rgba(46, 125, 50, 0.1);
            border-color: var(--secondary);
            color: var(--secondary);
        }

        /* Main Grid Area */
        .main-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 0 1rem;
        }

        .item-card {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 1rem;
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #3d3d45;
        }

        .item-info h3 {
            font-size: 1.1rem;
            margin-bottom: 4px;
        }

        .item-info p {
            font-size: 0.85rem;
            color: var(--text-gray);
        }

        .action-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .time-input {
            width: 60px;
            padding: 6px;
            border-radius: 8px;
            border: 1px solid #4d4d55;
            background: #1e1e24;
            color: white;
            text-align: center;
        }

        .add-btn {
            background: var(--primary);
            border: none;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 1.4rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .add-btn.burn {
            background: var(--secondary);
        }

        /* Floating Summary and Reset */
        .bottom-bar {
            text-align: center;
            margin-top: 2rem;
            padding-bottom: 2rem;
        }

        .reset-btn {
            padding: 10px 24px;
            border-radius: 20px;
            border: none;
            background: #c62828;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="welcome-msg">Namaste! Welcome back to KatoriCalorie.</div>
        
        <div class="katori-container">
            <div class="katori-bowl">
                <div class="katori-fill" id="bowlFill"></div>
                <div class="meter-content">
                    <div class="meter-label">Today's Net</div>
                    <div class="meter-value" id="netCalories">0</div>
                    <div class="meter-target">/ 1700 kcal</div>
                </div>
            </div>
        </div>
    </div>

    <div class="search-container">
        <input type="text" class="search-box" id="searchBox" placeholder="Search Roti, Tea, Walking, Gym...">
        <button class="search-btn" onclick="filterItems()">Search</button>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('food')">🍽️ Food Menu</button>
        <button class="tab-btn exercise-tab" onclick="switchTab('exercise')">⚡ Burn Calories (Exercise)</button>
    </div>

    <div class="main-container">
        <div id="foodList"></div>
        <div id="exerciseList" style="display: none;"></div>
    </div>

    <div class="bottom-bar">
        <button class="reset-btn" onclick="resetTracker()">Reset Daily Data</button>
    </div>

    <script>
        // Database including Traditional Tea Varieties and Exercise Specs
        const foodDatabase = [
            { id: 'f1', name: 'Milk Tea with Sugar (গাখীৰ চাহ)', kcal: 90, unit: '1 cup' },
            { id: 'f2', name: 'Red Tea / Black Tea with Sugar (ৰঙা চাহ)', kcal: 45, unit: '1 cup' },
            { id: 'f3', name: 'Green Tea (গ্ৰীণ টী)', kcal: 5, unit: '1 cup' },
            { id: 'f4', name: 'Milk Tea Without Sugar (চেনি নোহোৱা চাহ)', kcal: 45, unit: '1 cup' },
            { id: 'f5', name: 'Red Tea Without Sugar (চেনি নোহোৱা ৰঙা চাহ)', kcal: 2, unit: '1 cup' },
            { id: 'f6', name: 'Roti (Plain)', kcal: 85, unit: '1 serving' },
            { id: 'f7', name: 'Masoor Daal', kcal: 150, unit: '1 katori' },
            { id: 'f8', name: 'Aloo Pitika', kcal: 90, unit: '1 katori' },
            { id: 'f9', name: 'Bhat (Boiled Rice)', kcal: 200, unit: '1 plate' },
            { id: 'f10', name: 'Masor Tenga', kcal: 140, unit: '1 katori' }
        ];

        const exerciseDatabase = [
            { id: 'e1', name: 'Walking (খোজ কঢ়া)', kcalPerMin: 4 },
            { id: 'e2', name: 'Running (দৌৰা)', kcalPerMin: 10 },
            { id: 'e3', name: 'Gym / Weight Training (জিম)', kcalPerMin: 6 },
            { id: 'e4', name: 'Cycling (চাইকেল চলোৱা)', kcalPerMin: 7 },
            { id: 'e5', name: 'Household Chores (ঘৰুৱা কাম)', kcalPerMin: 3 }
        ];

        let totalGained = 0;
        let totalBurned = 0;

        function renderLists() {
            const foodDiv = document.getElementById('foodList');
            foodDiv.innerHTML = foodDatabase.map(item => `
                <div class="item-card">
                    <div class="item-info">
                        <h3>${item.name}</h3>
                        <p>${item.kcal} kcal / ${item.unit}</p>
                    </div>
                    <div class="action-area">
                        <button class="add-btn" onclick="addFood(${item.kcal})">+</button>
                    </div>
                </div>
            `).join('');

            const exDiv = document.getElementById('exerciseList');
            exDiv.innerHTML = exerciseDatabase.map(item => `
                <div class="item-card">
                    <div class="item-info">
                        <h3>${item.name}</h3>
                        <p>~${item.kcalPerMin} kcal burned per minute</p>
                    </div>
                    <div class="action-area">
                        <input type="number" class="time-input" id="time-${item.id}" placeholder="Min" value="30">
                        <button class="add-btn burn" onclick="addExercise('${item.id}', ${item.kcalPerMin})">✓</button>
                    </div>
                </div>
            `).join('');
        }

        function switchTab(type) {
            const tabs = document.querySelectorAll('.tab-btn');
            tabs.forEach(t => t.classList.remove('active'));
            
            if(type === 'food') {
                document.getElementById('foodList').style.display = 'block';
                document.getElementById('exerciseList').style.display = 'none';
                tabs[0].classList.add('active');
            } else {
                document.getElementById('foodList').style.display = 'none';
                document.getElementById('exerciseList').style.display = 'block';
                tabs[1].classList.add('active');
            }
        }

        function filterItems() {
            const query = document.getElementById('searchBox').value.toLowerCase();
            
            // Search Food
            const cards = document.querySelectorAll('#foodList .item-card');
            cards.forEach((card, idx) => {
                const name = foodDatabase[idx].name.toLowerCase();
                card.style.display = name.includes(query) ? 'flex' : 'none';
            });

            // Search Exercise
            const exCards = document.querySelectorAll('#exerciseList .item-card');
            exCards.forEach((card, idx) => {
                const name = exerciseDatabase[idx].name.toLowerCase();
                card.style.display = name.includes(query) ? 'flex' : 'none';
            });
        }

        function addFood(kcal) {
            totalGained += kcal;
            updateMeter();
        }

        function addExercise(id, kcalPerMin) {
            const minutes = parseInt(document.getElementById(`time-${id}`).value) || 0;
            totalBurned += (kcalPerMin * minutes);
            updateMeter();
        }

        function updateMeter() {
            const net = Math.max(0, totalGained - totalBurned);
            document.getElementById('netCalories').innerText = net;
            
            // Handle Katori visual fill percentage (Target: 1700 kcal)
            const pct = Math.min(100, (net / 1700) * 100);
            document.getElementById('bowlFill').style.height = pct + '%';
        }

        function resetTracker() {
            totalGained = 0;
            totalBurned = 0;
            updateMeter();
        }

        // Run on load
        renderLists();
    </script>
</body>
</html>
